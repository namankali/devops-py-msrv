# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |        
          if [ -f requirements.txt ]; then
          pip install -r requirements.txt
          fi

      - name: Install CI Dependencies
        run: pip install flake8 pytest pip-audit
        
      - name: Run Lint
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No tests found. Skipping pytest."
          fi

      - name: Dependency Secuirty Audit
        run: pip audit || true

  docker-build-scan-push:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logon to Docker hub
        uses: docker/login-action@v3
        with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build Docker Image
        run: docker buildx build --load -t devops-py-service:latest .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy
        
      - name: Scan Docker Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            devops-py-service:latest

      - name: Build and Push Image
        run: docker buildx build --platform linux/amd64,linux/arm64 -t namankali/devops-py-service:latest --push .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build-scan-push

    steps:
      - name: Placeholder
        run: echo "Deploy step coming soon"
